[project]
name = "consultant-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mohammad Kousheshi", email = "mkousheshi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.28.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
consultant-bot-web = "consultant_bot.webui:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# docs/ contains illustrative Python snippets in markdown code fences, not real source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest asserts; not a security concern in test code.
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["consultant_bot"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
